{% extends "base.html" %}
{% block title %}Panel de Inventario{% endblock %}

{% block content %}
<div class="container mx-auto mt-8 px-4">
    <div class="bg-white p-8 rounded-xl shadow-lg border border-gray-100 mb-8">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">Gestión de Inventario</h1>
                <p class="text-gray-500 mt-2">Bienvenido, <span class="font-semibold text-blue-600">{{ current_user.nombre_completo }}</span>.</p>
            </div>
            <div class="flex gap-3">
                <a href="{{ url_for('inventario.lista_categorias') }}" class="btn btn-secondary">Gestionar Categorías</a>
                <button class="btn btn-primary">Nuevo Ingreso</button>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-blue-50 p-6 rounded-lg border border-blue-100 shadow-sm">
            <h3 class="text-lg font-semibold text-blue-800">Total Productos</h3>
            <p class="text-3xl font-bold text-blue-900 mt-2">0</p>
        </div>
        <div class="bg-green-50 p-6 rounded-lg border border-green-100 shadow-sm">
            <h3 class="text-lg font-semibold text-green-800">Stock Valorizado</h3>
            <p class="text-3xl font-bold text-green-900 mt-2">$0</p>
        </div>
        <div class="bg-yellow-50 p-6 rounded-lg border border-yellow-100 shadow-sm">
            <h3 class="text-lg font-semibold text-yellow-800">Alertas Stock Bajo</h3>
            <p class="text-3xl font-bold text-yellow-900 mt-2">0</p>
        </div>
    </div>
</div>
{% endblock %}
