{% extends "base.html" %}
{% block title %}Ingreso de Stock{% endblock %}

{% block content %}
<div class="container mx-auto mt-8 px-4 max-w-2xl">
    
    <div class="bg-white p-8 rounded-xl shadow-lg border border-gray-100">
        <div class="flex items-center gap-4 mb-6 border-b pb-4">
            <div class="h-12 w-12 bg-blue-100 rounded-full flex items-center justify-center text-blue-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
            </div>
            <div>
                <h2 class="text-2xl font-bold text-gray-800">Ingreso de Mercadería</h2>
                <p class="text-gray-500 text-sm">{{ producto.nombre }}</p>
            </div>
        </div>

        <form method="post" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Motivo / Origen</label>
                <input type="text" name="motivo" placeholder="Ej: Compra Factura #123, Donación, etc." 
                       class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" required>
            </div>

            {% if producto.tiene_serie %}
                <div class="bg-purple-50 p-4 rounded-lg border border-purple-100">
                    <label class="block text-sm font-bold text-purple-800 mb-2">Números de Serie</label>
                    <p class="text-xs text-purple-600 mb-2">Ingresa los números de serie escaneados, <strong>uno por línea</strong>.</p>
                    <textarea name="seriales" rows="6" 
                              class="w-full px-4 py-2 border border-purple-200 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none font-mono text-sm"
                              placeholder="SN100200&#10;SN100201&#10;SN100202" required></textarea>
                </div>
            {% else %}
                <div class="bg-blue-50 p-4 rounded-lg border border-blue-100">
                    <label class="block text-sm font-bold text-blue-800 mb-2">Cantidad a Ingresar</label>
                    <input type="number" name="cantidad" min="1" 
                           class="w-full px-4 py-2 border border-blue-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-xl font-bold text-center" 
                           placeholder="0" required>
                </div>
            {% endif %}

            <div class="flex justify-end gap-3 pt-4">
                <a href="{{ url_for('inventario.lista_productos') }}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary shadow-md">Registrar Ingreso</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
